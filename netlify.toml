# Netlify configuration for TechnoDocs static site
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Build with Vite and publish the production output
  publish = "dist"

  # Run the Vite build so import.meta.env VITE_* vars are embedded
  command = "npm run build"

# Local development configuration
[dev]
  # Command to run for local development
  command = "npm run dev"
  # Port for the Netlify CLI proxy
  port = 8888
  # Port where Vite dev server runs (see vite.config.js server.port)
  targetPort = 3001
  # Publish directory for local dev
  publish = "."
  # Auto-open browser
  autoLaunch = false
  # Disable HTML proxy rewriting to prevent module path mangling
  noHtmlProxy = true

# Headers for caching and security
[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy (CSP) - Protection contre XSS
    # Note: 'unsafe-inline' temporairement ajouté pour style-src pour permettre les styles inline dynamiques
    # Firebase: scripts et data access from gstatic.com and googleapis.com
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://www.gstatic.com; frame-src https://*.firebaseapp.com;"

    # Security headers renforcés pour la production
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # HTTP Strict Transport Security (HSTS) - Force HTTPS
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Permissions Policy - Désactive les fonctionnalités non nécessaires
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"

    # Cache control for HTML (no cache, always revalidate)
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    # Cache CSS files for 1 year (Vite outputs hashed filenames in /assets/)
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    # Cache JS files for 1 year (Vite outputs hashed filenames in /assets/)
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    # Cache images for 1 year
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    # Cache images for 1 year
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    # Cache SVG files for 1 year
    Cache-Control = "public, max-age=31536000, immutable"

# Redirect rules — fallback SPA pour les routes non trouvées
# Exclut les assets statiques src/ pour éviter les 500 en dev:netlify
[[redirects]]
  from = "/src/*"
  to = "/src/:splat"
  status = 200

# Servir les fichiers HTML statiques dans src/pages sans redirect
[[redirects]]
  from = "/src/pages/**/*.html"
  to = "/src/pages/:splat.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.deploy-preview]
  [[context.deploy-preview.redirects]]
    from = "/"
    to = "/_dev.html"
    status = 302

