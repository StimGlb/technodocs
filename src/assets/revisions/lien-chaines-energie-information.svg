<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxInfo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="boxEnergie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f2a1e"/>
      <stop offset="100%" stop-color="#2d1f14"/>
    </linearGradient>
    <linearGradient id="action" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 5 10 L 10 0 z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect width="900" height="320" rx="12" fill="url(#bg)"/>
  <text x="450" y="24" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Lien entre cha&#238;ne d'information et cha&#238;ne d'&#233;nergie</text>

  <!-- Label CHAÎNE D'INFORMATION -->
  <text x="30" y="65" fill="#93c5fd" font-size="11" font-weight="700" transform="rotate(-90, 30, 105)" text-anchor="middle">INFORMATION</text>

  <!-- Ligne info -->
  <rect x="55" y="42" width="155" height="60" rx="8" fill="url(#boxInfo)" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="132" y="65" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">ACQ&#201;RIR</text>
  <text x="132" y="80" text-anchor="middle" fill="#cbd5e1" font-size="10">Capteurs</text>
  <line x1="215" y1="72" x2="235" y2="72" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="42" width="155" height="60" rx="8" fill="url(#boxInfo)" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="317" y="65" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">TRAITER</text>
  <text x="317" y="80" text-anchor="middle" fill="#cbd5e1" font-size="10">Microcontr&#244;leur</text>
  <line x1="400" y1="72" x2="420" y2="72" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="425" y="42" width="155" height="60" rx="8" fill="url(#boxInfo)" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="502" y="65" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">COMMUNIQUER</text>
  <text x="502" y="80" text-anchor="middle" fill="#cbd5e1" font-size="10">IHM, &#233;cran</text>

  <!-- Flèche COMMANDER vers chaîne énergie -->
  <line x1="317" y1="107" x2="317" y2="155" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrowDown)"/>
  <text x="350" y="138" fill="#818cf8" font-size="10" font-weight="600">COMMANDER</text>

  <!-- Label CHAÎNE D'ÉNERGIE -->
  <text x="30" y="210" fill="#fbbf24" font-size="11" font-weight="700" transform="rotate(-90, 30, 245)" text-anchor="middle">&#201;NERGIE</text>

  <!-- Ligne énergie -->
  <rect x="55" y="165" width="155" height="60" rx="8" fill="url(#boxEnergie)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="132" y="188" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">ALIMENTER</text>
  <text x="132" y="205" text-anchor="middle" fill="#d4a574" font-size="10">Source d'&#233;nergie</text>
  <line x1="215" y1="195" x2="235" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="165" width="155" height="60" rx="8" fill="url(#boxEnergie)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="317" y="188" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">DISTRIBUER</text>
  <text x="317" y="205" text-anchor="middle" fill="#d4a574" font-size="10">Interrupteur, relais</text>
  <line x1="400" y1="195" x2="420" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="425" y="165" width="155" height="60" rx="8" fill="url(#boxEnergie)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="502" y="188" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">CONVERTIR</text>
  <text x="502" y="205" text-anchor="middle" fill="#d4a574" font-size="10">Moteur, LED...</text>
  <line x1="585" y1="195" x2="605" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="610" y="165" width="155" height="60" rx="8" fill="url(#boxEnergie)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="687" y="188" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">TRANSMETTRE</text>
  <text x="687" y="205" text-anchor="middle" fill="#d4a574" font-size="10">Engrenages, roue</text>
  <line x1="770" y1="195" x2="790" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="795" y="165" width="90" height="60" rx="8" fill="url(#action)"/>
  <text x="840" y="198" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">ACTION</text>

  <!-- Légende -->
  <rect x="55" y="255" width="12" height="12" rx="2" fill="#3b82f6"/>
  <text x="75" y="266" fill="#93c5fd" font-size="10">Cha&#238;ne d'information</text>
  <rect x="220" y="255" width="12" height="12" rx="2" fill="#f59e0b"/>
  <text x="240" y="266" fill="#fbbf24" font-size="10">Cha&#238;ne d'&#233;nergie</text>
  <line x1="400" y1="261" x2="430" y2="261" stroke="#818cf8" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="440" y="266" fill="#818cf8" font-size="10">Ordre de commande</text>

  <text x="450" y="300" text-anchor="middle" fill="#94a3b8" font-size="11" font-style="italic">La cha&#238;ne d'information pilote la cha&#238;ne d'&#233;nergie via la fonction COMMANDER</text>
</svg>
