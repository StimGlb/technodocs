<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="router" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="switch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="900" height="340" rx="12" fill="url(#bg)"/>
  <text x="450" y="24" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Sch&#233;ma d'un r&#233;seau local (LAN)</text>

  <!-- Zone Internet -->
  <rect x="350" y="38" width="200" height="45" rx="20" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="450" y="65" text-anchor="middle" fill="#f87171" font-size="12" font-weight="600">&#127760; INTERNET</text>

  <!-- Routeur / Box -->
  <line x1="450" y1="83" x2="450" y2="105" stroke="#a78bfa" stroke-width="2"/>
  <rect x="360" y="105" width="180" height="50" rx="8" fill="url(#router)"/>
  <text x="450" y="128" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">ROUTEUR / BOX</text>
  <text x="450" y="145" text-anchor="middle" fill="#c4b5fd" font-size="10">Passerelle vers Internet</text>

  <!-- Ligne routeur → commutateur -->
  <line x1="450" y1="155" x2="450" y2="185" stroke="#64748b" stroke-width="2"/>

  <!-- Commutateur (switch) -->
  <rect x="340" y="185" width="220" height="50" rx="8" fill="url(#switch)"/>
  <text x="450" y="208" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">COMMUTATEUR (SWITCH)</text>
  <text x="450" y="225" text-anchor="middle" fill="#bfdbfe" font-size="10">Distribue les donn&#233;es dans le r&#233;seau local</text>

  <!-- Lignes vers les terminaux -->
  <line x1="370" y1="235" x2="120" y2="275" stroke="#64748b" stroke-width="1.5"/>
  <line x1="420" y1="235" x2="310" y2="275" stroke="#64748b" stroke-width="1.5"/>
  <line x1="480" y1="235" x2="500" y2="275" stroke="#64748b" stroke-width="1.5"/>
  <line x1="530" y1="235" x2="690" y2="275" stroke="#64748b" stroke-width="1.5"/>
  <line x1="545" y1="235" x2="830" y2="275" stroke="#64748b" stroke-width="1.5"/>

  <!-- Terminal 1 : PC -->
  <rect x="55" y="275" width="130" height="45" rx="8" fill="url(#box)" stroke="#475569" stroke-width="1.2"/>
  <text x="120" y="295" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">&#128187; PC 1</text>
  <text x="120" y="310" text-anchor="middle" fill="#fbbf24" font-size="9">192.168.1.10</text>

  <!-- Terminal 2 : PC -->
  <rect x="245" y="275" width="130" height="45" rx="8" fill="url(#box)" stroke="#475569" stroke-width="1.2"/>
  <text x="310" y="295" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">&#128187; PC 2</text>
  <text x="310" y="310" text-anchor="middle" fill="#fbbf24" font-size="9">192.168.1.11</text>

  <!-- Terminal 3 : Imprimante -->
  <rect x="435" y="275" width="130" height="45" rx="8" fill="url(#box)" stroke="#475569" stroke-width="1.2"/>
  <text x="500" y="295" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">&#128424; Imprimante</text>
  <text x="500" y="310" text-anchor="middle" fill="#fbbf24" font-size="9">192.168.1.20</text>

  <!-- Terminal 4 : Serveur -->
  <rect x="625" y="275" width="130" height="45" rx="8" fill="url(#box)" stroke="#475569" stroke-width="1.2"/>
  <text x="690" y="295" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">&#128421; Serveur</text>
  <text x="690" y="310" text-anchor="middle" fill="#fbbf24" font-size="9">192.168.1.1</text>

  <!-- Terminal 5 : Smartphone Wi-Fi -->
  <rect x="765" y="275" width="130" height="45" rx="8" fill="url(#box)" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="830" y="295" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">&#128241; Smartphone</text>
  <text x="830" y="310" text-anchor="middle" fill="#fbbf24" font-size="9">192.168.1.30 (Wi-Fi)</text>
</svg>
