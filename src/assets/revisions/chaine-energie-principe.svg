<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="action" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>

  <!-- Bloc ALIMENTER -->
  <rect x="20" y="30" width="150" height="80" rx="8" fill="url(#box)" stroke="#475569" stroke-width="1.5"/>
  <text x="95" y="62" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">ALIMENTER</text>
  <text x="95" y="82" text-anchor="middle" fill="#94a3b8" font-size="11" font-style="italic">Fournir l'énergie</text>

  <!-- Flèche 1 -->
  <line x1="175" y1="70" x2="200" y2="70" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>

  <!-- Bloc DISTRIBUER -->
  <rect x="205" y="30" width="150" height="80" rx="8" fill="url(#box)" stroke="#475569" stroke-width="1.5"/>
  <text x="280" y="62" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">DISTRIBUER</text>
  <text x="280" y="82" text-anchor="middle" fill="#94a3b8" font-size="11" font-style="italic">Réguler, commander</text>

  <!-- Flèche 2 -->
  <line x1="360" y1="70" x2="385" y2="70" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bloc CONVERTIR -->
  <rect x="390" y="30" width="150" height="80" rx="8" fill="url(#box)" stroke="#475569" stroke-width="1.5"/>
  <text x="465" y="62" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">CONVERTIR</text>
  <text x="465" y="82" text-anchor="middle" fill="#94a3b8" font-size="11" font-style="italic">Changer la forme</text>

  <!-- Flèche 3 -->
  <line x1="545" y1="70" x2="570" y2="70" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bloc TRANSMETTRE -->
  <rect x="575" y="30" width="150" height="80" rx="8" fill="url(#box)" stroke="#475569" stroke-width="1.5"/>
  <text x="650" y="62" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">TRANSMETTRE</text>
  <text x="650" y="82" text-anchor="middle" fill="#94a3b8" font-size="11" font-style="italic">Acheminer</text>

  <!-- Flèche 4 -->
  <line x1="730" y1="70" x2="755" y2="70" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bloc ACTION -->
  <rect x="760" y="30" width="120" height="80" rx="8" fill="url(#action)"/>
  <text x="820" y="68" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">ACTION</text>
  <text x="820" y="86" text-anchor="middle" fill="#bfdbfe" font-size="11" font-style="italic">Résultat final</text>

  <!-- Légende énergie -->
  <text x="95" y="145" text-anchor="middle" fill="#fbbf24" font-size="10">Énergie</text>
  <text x="95" y="160" text-anchor="middle" fill="#fbbf24" font-size="10">d'entrée</text>
  <text x="280" y="150" text-anchor="middle" fill="#fbbf24" font-size="10">→</text>
  <text x="465" y="150" text-anchor="middle" fill="#fbbf24" font-size="10">→</text>
  <text x="650" y="145" text-anchor="middle" fill="#fbbf24" font-size="10">Énergie</text>
  <text x="650" y="160" text-anchor="middle" fill="#fbbf24" font-size="10">utile</text>

  <!-- Pertes -->
  <text x="465" y="180" text-anchor="middle" fill="#f87171" font-size="10">⚡ Pertes (chaleur, bruit…)</text>
</svg>
