<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="last" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Fond -->
  <rect width="900" height="180" rx="12" fill="url(#bg)"/>

  <!-- Titre -->
  <text x="450" y="24" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Le cycle de vie d'un produit</text>

  <!-- Bloc 1 : Extraction -->
  <rect x="15" y="42" width="148" height="70" rx="8" fill="url(#box)" stroke="#475569" stroke-width="1.5"/>
  <text x="89" y="68" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">EXTRACTION</text>
  <text x="89" y="84" text-anchor="middle" fill="#94a3b8" font-size="10">des mati&#232;res</text>
  <text x="89" y="97" text-anchor="middle" fill="#94a3b8" font-size="10">premi&#232;res</text>

  <line x1="168" y1="77" x2="188" y2="77" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bloc 2 : Fabrication -->
  <rect x="193" y="42" width="148" height="70" rx="8" fill="url(#box)" stroke="#475569" stroke-width="1.5"/>
  <text x="267" y="68" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">FABRICATION</text>
  <text x="267" y="86" text-anchor="middle" fill="#94a3b8" font-size="10">Usine, assemblage</text>

  <line x1="346" y1="77" x2="366" y2="77" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bloc 3 : Transport -->
  <rect x="371" y="42" width="148" height="70" rx="8" fill="url(#box)" stroke="#475569" stroke-width="1.5"/>
  <text x="445" y="68" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">TRANSPORT</text>
  <text x="445" y="86" text-anchor="middle" fill="#94a3b8" font-size="10">Logistique</text>

  <line x1="524" y1="77" x2="544" y2="77" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bloc 4 : Utilisation -->
  <rect x="549" y="42" width="148" height="70" rx="8" fill="url(#box)" stroke="#475569" stroke-width="1.5"/>
  <text x="623" y="68" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">UTILISATION</text>
  <text x="623" y="86" text-anchor="middle" fill="#94a3b8" font-size="10">Par l'usager</text>

  <line x1="702" y1="77" x2="722" y2="77" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bloc 5 : Fin de vie (vert) -->
  <rect x="727" y="42" width="158" height="70" rx="8" fill="url(#last)" stroke="#34d399" stroke-width="1.5"/>
  <text x="806" y="64" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">FIN DE VIE</text>
  <text x="806" y="80" text-anchor="middle" fill="#a7f3d0" font-size="10">Recyclage</text>
  <text x="806" y="93" text-anchor="middle" fill="#a7f3d0" font-size="10">R&#233;emploi</text>
  <text x="806" y="106" text-anchor="middle" fill="#a7f3d0" font-size="10">Mise en d&#233;charge</text>

  <!-- Flèche de retour recyclage -->
  <path d="M 806 117 L 806 150 L 89 150 L 89 117" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#34d399"/>
    </marker>
  </defs>
  <text x="450" y="166" text-anchor="middle" fill="#34d399" font-size="10" font-style="italic">&#201;coconception : r&#233;duire l'impact &#224; chaque &#233;tape</text>
</svg>
