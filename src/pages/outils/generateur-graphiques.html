<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Générateur de graphiques v2 | TechnoDocs</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Lexend:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../css/tools.css" />
    <link rel="stylesheet" href="../../css/chart-generator.css" />
  </head>
  <body>
    <div id="app-header"></div>

    <main class="app">
      <!-- SECTION HÉRO -->
      <div class="app-header">
        <span class="app-header__badge">Outil Interactif</span>
        <h1>Générateur de <span class="hl">Graphiques</span></h1>
        <p>Comparaison multi-séries et visualisation en temps réel</p>
      </div>

      <!-- CONTENEUR PRINCIPAL (2 colonnes) -->
      <div class="chart-container">
        <!-- COLONNE GAUCHE : Contrôles -->
        <div>
          <!-- FORMULAIRE (masqué en mode comparatif) -->
          <div class="chart-form" id="formPanel">
            <h2>Ajouter des données</h2>

            <div class="form-group">
              <label for="labelInput">Étiquette</label>
              <input
                type="text"
                id="labelInput"
                placeholder="Ex: Janvier, Ventes, etc."
              />
            </div>

            <div class="form-group">
              <label for="valueInput">Valeur</label>
              <input
                type="number"
                id="valueInput"
                placeholder="Ex: 1200"
                min="0"
              />
            </div>

            <div class="form-group">
              <label for="unitInput">Unité</label>
              <input
                type="text"
                id="unitInput"
                placeholder="Ex: kWh, €, °C, km…"
                maxlength="10"
                value="kWh"
              />
            </div>

            <div class="form-group" id="fixedTotalGroup" style="display: none">
              <label for="fixedTotalInput">Total fixe (optionnel)</label>
              <input
                type="number"
                id="fixedTotalInput"
                placeholder="Laisser vide = somme auto"
                min="0"
              />
            </div>

            <div class="form-error" id="formError" role="alert" hidden></div>

            <div class="form-actions">
              <button class="btn btn-primary" id="addBtn">Ajouter</button>
            </div>

            <button class="btn btn-danger" id="clearAllBtn">
              Tout effacer
            </button>
          </div>

          <!-- TYPE DE GRAPHIQUE -->
          <div class="chart-panel">
            <h2>Type de graphique</h2>
            <div class="chart-type-toggle">
              <button class="btn-toggle active" id="chartTypeBar">
                <span aria-hidden="true">📊</span> Barres
              </button>
              <button class="btn-toggle" id="chartTypeLine">
                <span aria-hidden="true">📈</span> Courbe
              </button>
              <button class="btn-toggle" id="chartTypePie">
                <span aria-hidden="true">🥧</span> Camembert
              </button>
            </div>
          </div>

          <!-- AFFICHAGE -->
          <div class="chart-panel" id="displayPanel">
            <h2>Affichage</h2>
            <div class="chart-type-toggle">
              <button class="btn-toggle active" id="displayAbsolute">
                📏 Unité
              </button>
              <button class="btn-toggle" id="displayPercent">📊 Pourcentage</button>
            </div>
          </div>

          <!-- STATISTIQUES -->
          <div class="chart-panel" id="statsPanel" style="display: none">
            <h2>Statistiques</h2>
            <div id="statsContent"></div>
          </div>

          <!-- LISTE DES DONNÉES -->
          <div class="chart-data-section">
            <h2>Données</h2>
            <div class="chart-data-list" id="dataList">
              <div class="empty-state">
                <p>Aucune donnée pour le moment</p>
              </div>
            </div>
          </div>
        </div>

        <!-- COLONNE DROITE : Graphique -->
        <div class="chart-canvas-wrapper">
          <h2>Aperçu</h2>
          <div class="chart-wrapper">
            <canvas
              id="chartCanvas"
              role="img"
              aria-label="Graphique généré"
            ></canvas>
          </div>
          <div class="chart-actions">
            <button id="chartExport" class="chart-actions__btn">
              💾 Exporter JSON
            </button>
            <label class="chart-actions__btn">
              📂 Importer JSON
              <input
                type="file"
                accept=".json"
                id="chartImport"
                style="display: none"
              />
            </label>
            <button id="chartExportPNG" class="chart-actions__btn">
              📸 Exporter PNG
            </button>
          </div>
        </div>
      </div>
    </main>

    <div id="app-footer"></div>

    <!-- Chart.js (local, conforme CSP) -->
    <script src="../../js/libs/chart.umd.min.js"></script>

    <!-- Composants dynamiques (Header/Footer) -->
    <script type="module" src="../../js/components.js"></script>

    <!-- Générateur de graphiques v2 -->
    <script type="module" src="../../js/chart-generator.js"></script>
  </body>
</html>
