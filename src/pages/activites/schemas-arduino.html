<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Schémas de montages Arduino — Tinkercad — TechnoDocs"
    />
    <title>Schémas Arduino | TechnoDocs</title>
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/cours.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================
         CARDS SCHÉMAS — grille responsive
         ============================================ */
      .schemas-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
        padding: 0 1rem;
        max-width: 1200px;
        margin: 0 auto 2rem;
      }

      .schema-card {
        background: var(--color-white, #fff);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
      }
      .schema-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }
      .schema-card:focus-visible {
        outline: 3px solid var(--color-primary-500, #3b82f6);
        outline-offset: 2px;
      }

      .schema-card__img-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        background: var(--color-gray-100, #f3f4f6);
      }
      .schema-card__img-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        padding: 0.75rem;
        transition: transform 0.3s ease;
      }
      .schema-card:hover .schema-card__img-wrapper img {
        transform: scale(1.03);
      }

      /* Badge de difficulté sur la vignette */
      .schema-card__difficulty {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        padding: 0.25rem 0.625rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        pointer-events: none;
      }
      .schema-card__difficulty--debutant {
        background: #d1fae5;
        color: #065f46;
      }
      .schema-card__difficulty--intermediaire {
        background: #fef3c7;
        color: #92400e;
      }
      .schema-card__difficulty--avance {
        background: #fecaca;
        color: #991b1b;
      }

      /* Zone icône zoom */
      .schema-card__zoom-hint {
        position: absolute;
        bottom: 0.5rem;
        right: 0.5rem;
        width: 2rem;
        height: 2rem;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .schema-card:hover .schema-card__zoom-hint {
        opacity: 1;
      }
      .schema-card__zoom-hint svg {
        width: 1rem;
        height: 1rem;
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .schema-card__body {
        padding: 1rem 1.25rem 1.25rem;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .schema-card__title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0;
        color: var(--color-gray-900, #111827);
      }
      .schema-card__desc {
        font-size: 0.875rem;
        color: var(--color-gray-500, #6b7280);
        margin: 0;
        line-height: 1.5;
      }
      .schema-card__tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
        margin-top: auto;
        padding-top: 0.5rem;
      }
      .schema-card__tag {
        font-size: 0.7rem;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        background: var(--color-gray-100, #f3f4f6);
        color: var(--color-gray-600, #4b5563);
        font-weight: 500;
      }

      /* ============================================
         MODAL ZOOM + CONSIGNES
         ============================================ */
      .schema-modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      .schema-modal-overlay.show {
        display: flex;
        opacity: 1;
      }
      /* Petit délai pour l'animation d'entrée */
      .schema-modal-overlay.entering {
        opacity: 0;
      }

      .schema-modal {
        background: var(--color-white, #fff);
        border-radius: 16px;
        max-width: 960px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        position: relative;
        transform: translateY(20px);
        transition: transform 0.25s ease;
      }
      .schema-modal-overlay.show .schema-modal {
        transform: translateY(0);
      }

      .schema-modal__close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        width: 2.5rem;
        height: 2.5rem;
        border: none;
        background: var(--color-gray-100, #f3f4f6);
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        color: var(--color-gray-600, #4b5563);
        transition: background 0.2s ease;
        z-index: 1;
      }
      .schema-modal__close:hover {
        background: var(--color-gray-200, #e5e7eb);
      }

      .schema-modal__img-zone {
        background: var(--color-gray-50, #f9fafb);
        border-radius: 16px 16px 0 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        min-height: 300px;
      }
      .schema-modal__img-zone img {
        max-width: 100%;
        max-height: 55vh;
        object-fit: contain;
        border-radius: 4px;
      }

      .schema-modal__content {
        padding: 1.5rem 2rem 2rem;
      }
      .schema-modal__title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 0 0.25rem;
        color: var(--color-gray-900, #111827);
      }
      .schema-modal__difficulty-badge {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }

      .schema-modal__section {
        margin-bottom: 1.25rem;
      }
      .schema-modal__section-title {
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--color-gray-400, #9ca3af);
        margin: 0 0 0.5rem;
      }

      /* Consignes de montage */
      .schema-modal__steps {
        list-style: none;
        padding: 0;
        margin: 0;
        counter-reset: step;
      }
      .schema-modal__steps li {
        counter-increment: step;
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0.625rem 0;
        font-size: 0.9rem;
        line-height: 1.5;
        color: var(--color-gray-700, #374151);
        border-bottom: 1px solid var(--color-gray-100, #f3f4f6);
      }
      .schema-modal__steps li:last-child {
        border-bottom: none;
      }
      .schema-modal__steps li::before {
        content: counter(step);
        flex-shrink: 0;
        width: 1.5rem;
        height: 1.5rem;
        background: var(--color-primary-500, #3b82f6);
        color: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 700;
      }

      /* Liste composants */
      .schema-modal__components {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .schema-modal__components li {
        background: var(--color-gray-50, #f9fafb);
        border: 1px solid var(--color-gray-200, #e5e7eb);
        border-radius: 8px;
        padding: 0.4rem 0.75rem;
        font-size: 0.825rem;
        color: var(--color-gray-700, #374151);
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      /* Niveaux concernés dans le modal */
      .schema-modal__niveaux {
        display: flex;
        gap: 0.375rem;
        flex-wrap: wrap;
      }
      .schema-modal__niveau-chip {
        font-size: 0.75rem;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        font-weight: 500;
      }
      .schema-modal__niveau-chip--5eme {
        background: #dbeafe;
        color: #1e40af;
      }
      .schema-modal__niveau-chip--4eme {
        background: #ede9fe;
        color: #5b21b6;
      }
      .schema-modal__niveau-chip--3eme {
        background: #fce7f3;
        color: #9d174d;
      }

      /* ============================================
         FILTRE PAR NIVEAU
         ============================================ */
      .schemas-filters {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin: 0 auto 2rem;
        max-width: 1200px;
        padding: 0 1rem;
      }
      .schemas-filters__btn {
        padding: 0.5rem 1.25rem;
        border: 2px solid var(--color-gray-200, #e5e7eb);
        border-radius: 100px;
        background: transparent;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--color-gray-600, #4b5563);
        transition: all 0.2s ease;
      }
      .schemas-filters__btn:hover {
        border-color: var(--color-primary-300, #93c5fd);
        color: var(--color-primary-600, #2563eb);
      }
      .schemas-filters__btn.active {
        background: var(--color-primary-500, #3b82f6);
        border-color: var(--color-primary-500, #3b82f6);
        color: #fff;
      }

      /* ============================================
         RESPONSIVE
         ============================================ */
      @media (max-width: 640px) {
        .schemas-grid {
          grid-template-columns: 1fr;
        }
        .schema-modal__content {
          padding: 1.25rem 1.25rem 1.5rem;
        }
        .schema-modal__img-zone {
          min-height: 200px;
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main>
      <!-- ========== HERO ========== -->
      <section class="cours-hero">
        <div class="cours-hero__shapes" aria-hidden="true">
          <div class="cours-shape cours-shape--1"></div>
          <div class="cours-shape cours-shape--2"></div>
          <div class="cours-shape cours-shape--3"></div>
        </div>
        <div class="cours-hero__header">
          <span class="cours-hero__badge">⚡ Montages Arduino</span>
          <h1 class="cours-hero__title">Schémas de montages — Tinkercad</h1>
          <p class="cours-hero__subtitle">
            Reproduis chaque montage sur ta breadboard en suivant les consignes.
            Clique sur un schéma pour voir les détails.
          </p>
          <div class="cours-hero__chips">
            <span class="cours-chip">🔧 Multi-niveaux</span>
            <span class="cours-chip">🖥️ Tinkercad</span>
          </div>
        </div>
      </section>

      <!-- ========== FILTRES ========== -->
      <div class="schemas-filters" id="schemaFilters">
        <button class="schemas-filters__btn active" data-filter="all">Tous</button>
        <button class="schemas-filters__btn" data-filter="5eme">5ème</button>
        <button class="schemas-filters__btn" data-filter="4eme">4ème</button>
        <button class="schemas-filters__btn" data-filter="3eme">3ème</button>
      </div>

      <!-- ========== GRILLE SCHÉMAS (générée par JS) ========== -->
      <section class="schemas-grid" id="schemasGrid">
        <!-- Les cards sont injectées dynamiquement -->
      </section>
    </main>

    <!-- ========== MODAL ZOOM ========== -->
    <div class="schema-modal-overlay" id="schemaModal">
      <div class="schema-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="schema-modal__close" id="modalClose" aria-label="Fermer">✕</button>

        <div class="schema-modal__img-zone">
          <img id="modalImg" src="" alt="" />
        </div>

        <div class="schema-modal__content">
          <h2 class="schema-modal__title" id="modalTitle"></h2>
          <span class="schema-modal__difficulty-badge" id="modalDifficulty"></span>

          <!-- Niveaux concernés -->
          <div class="schema-modal__section">
            <p class="schema-modal__section-title">Niveaux</p>
            <div class="schema-modal__niveaux" id="modalNiveaux"></div>
          </div>

          <!-- Composants nécessaires -->
          <div class="schema-modal__section">
            <p class="schema-modal__section-title">Composants nécessaires</p>
            <ul class="schema-modal__components" id="modalComponents"></ul>
          </div>

          <!-- Consignes de montage -->
          <div class="schema-modal__section">
            <p class="schema-modal__section-title">Consignes de montage</p>
            <ol class="schema-modal__steps" id="modalSteps"></ol>
          </div>
        </div>
      </div>
    </div>

    <div id="footer-placeholder"></div>

    <script type="module" src="/src/js/main.js"></script>
    <script>
      // ============================================
      // DONNÉES DES SCHÉMAS
      // ============================================
      // Pour ajouter un schéma : ajouter un objet dans ce tableau.
      // Les images PNG doivent être dans /src/assets/schemas-arduino/
      // ============================================
      const SCHEMAS = [
        {
          id: "led-simple",
          title: "Allumer une LED",
          description: "Circuit de base : une LED avec sa résistance de protection, pilotée par une sortie numérique.",
          image: "/src/assets/schemas-arduino/led-double.png",
          difficulty: "debutant",      // debutant | intermediaire | avance
          niveaux: ["5eme", "4eme"],   // niveaux concernés
          composants: [
            "1× Arduino Uno",
            "1× Breadboard",
            "1× LED (rouge)",
            "1× LED (verte)",
            "1× Résistance 220Ω",
            "2× Fils de connexion"
          ],
          consignes: [
            "Place l'Arduino et la breadboard côte à côte sur le plan de travail Tinkercad.",
            "Insère la LED sur la breadboard : la patte longue (anode +) sur une ligne, la patte courte (cathode −) sur la ligne voisine.",
            "Branche la résistance de 220Ω entre la patte longue (anode) de la LED et une ligne libre.",
            "Relie la ligne de la résistance à la broche 12 de l'Arduino avec un fil.",
            "Relie le LED verte de la même manière : patte longue à une ligne, patte courte à la ligne GND, puis résistance 220Ω entre la patte longue et la broche 11.",
            "Relie la patte courte (cathode) de la LED à la ligne GND (−) de la breadboard.",
            "Connecte la ligne GND de la breadboard à une broche GND de l'Arduino.",
            "Lance la simulation et vérifie que la LED s'allume."
          ]
        },
        {
          id: "bouton-led",
          title: "Bouton-poussoir + LED",
          description: "Lecture d'un bouton-poussoir en entrée numérique pour commander l'allumage d'une LED.",
          image: "/src/assets/schemas-arduino/bouton-led.png",
          difficulty: "debutant",
          niveaux: ["5eme", "4eme"],
          composants: [
            "1× Arduino Uno",
            "1× Breadboard",
            "1× LED",
            "1× Résistance 220Ω (LED)",
            "1× Résistance 10kΩ (pull-down)",
            "1× Bouton-poussoir",
            "5× Fils de connexion"
          ],
          consignes: [
            "Ajoute une LED à la broche 7 de l'Arduino avec une résistance de 220Ω en série (comme dans le schéma précédent).",
            "Place le bouton-poussoir en haut à gauche.",
            "Branche une patte du bouton au +5V de l'Arduino.",
            "Branche l'autre patte du même côté à la broche 8 de l'Arduino (entrée numérique).",
            "Ajoute la résistance pull-down de 10kΩ entre l'autre patte du bouton et GND.",
            "Programme : si lire la broche 8 = 1 → allumer LED, sinon → éteindre.",
            "Lance la simulation et appuie sur le bouton pour tester."
          ]
        },
{
        id: "pir-led",
        title: "Capteur de présence PIR + LED",
        description: "Détection de mouvement avec un capteur PIR : allumer une LED automatiquement quand une présence est détectée.",
        image: "/src/assets/schemas-arduino/pir-led.png",
        difficulty: "intermediaire",
        niveaux: ["4eme", "3eme"],
        composants: [
          "1× Arduino Uno",
          "1× Capteur de présence PIR",
          "1× LED (bleue)",
          "1× Résistance 220Ω",
          "5× Fils de connexion"
        ],
        consignes: [
          "Place le capteur PIR sur le plan de travail, face plate (dôme) orientée vers la zone à surveiller.",
          "Relie la broche VCC (rouge) du PIR à la broche 5V de l'Arduino.",
          "Relie la broche GND (blanc) du PIR à une broche GND de l'Arduino.",
          "Relie la broche Signal (vert) du PIR à la broche numérique 2 de l'Arduino.",
          "Insère la LED : la patte longue (anode +) reliée à une résistance de 220Ω, puis à la broche numérique 3 de l'Arduino. La patte courte (cathode −) reliée au GND.",
          "Programme : lire digitalRead(2) — si HIGH (mouvement détecté), allumer la LED sur la broche 3, sinon l'éteindre.",
          "Lance la simulation. Le capteur PIR a un délai de calibration d'environ 30 secondes au démarrage — attends avant de tester."
        ]
      },
        {
          id: "servo-potentiometre",
          title: "Servomoteur + Potentiomètre",
          description: "Contrôle de la position d'un servomoteur avec un potentiomètre — lecture analogique et commande PWM.",
          image: "/src/assets/schemas-arduino/servo-potentiometre.png",
          difficulty: "avance",
          niveaux: ["4eme", "3eme"],
          composants: [
            "1× Arduino Uno",
            "1× Breadboard",
            "1× Servomoteur (SG90 ou similaire)",
            "1× Potentiomètre 10kΩ",
            "6× Fils de connexion"
          ],
          consignes: [
            "Place le potentiomètre sur la breadboard.",
            "Branche la patte gauche du potentiomètre au +5V, la patte droite au GND.",
            "Branche la patte centrale (curseur) à l'entrée analogique A0.",
            "Connecte le servomoteur : fil rouge au +5V, fil marron/noir au GND, fil orange/jaune à la broche 9 (PWM).",
            "Programme : lire analogRead(A0) (valeur 0–1023) et la convertir en angle (0–180°) avec la fonction map().",
            "Utilise la bibliothèque Servo.h : Servo.attach(9) puis Servo.write(angle).",
            "Lance la simulation et tourne le potentiomètre pour voir le servomoteur suivre."
          ]
        }
      ];

      // ============================================
      // RENDU DES CARDS
      // ============================================
      const grid = document.getElementById('schemasGrid');

      const DIFFICULTY_LABELS = {
        debutant: '🟢 Débutant',
        intermediaire: '🟡 Intermédiaire',
        avance: '🔴 Avancé'
      };

      function renderCards(filter = 'all') {
        grid.innerHTML = '';

        const filtered = filter === 'all'
          ? SCHEMAS
          : SCHEMAS.filter(s => s.niveaux.includes(filter));

        if (filtered.length === 0) {
          grid.innerHTML = '<p style="text-align:center;color:var(--color-gray-400);grid-column:1/-1;padding:2rem;">Aucun schéma pour ce niveau.</p>';
          return;
        }

        filtered.forEach(schema => {
          const card = document.createElement('div');
          card.className = 'schema-card';
          card.tabIndex = 0;
          card.setAttribute('role', 'button');
          card.setAttribute('aria-label', `Voir le schéma : ${schema.title}`);
          card.dataset.schemaId = schema.id;

          card.innerHTML = `
            <div class="schema-card__img-wrapper">
              <img src="${schema.image}" alt="Schéma Tinkercad : ${schema.title}" loading="lazy" />
              <span class="schema-card__difficulty schema-card__difficulty--${schema.difficulty}">
                ${DIFFICULTY_LABELS[schema.difficulty]}
              </span>
              <div class="schema-card__zoom-hint" aria-hidden="true">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
              </div>
            </div>
            <div class="schema-card__body">
              <h2 class="schema-card__title">${schema.title}</h2>
              <p class="schema-card__desc">${schema.description}</p>
              <div class="schema-card__tags">
                ${schema.niveaux.map(n => `<span class="schema-card__tag">${n.replace('eme', 'ème')}</span>`).join('')}
              </div>
            </div>
          `;

          // Ouverture du modal
          card.addEventListener('click', () => openModal(schema));
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              openModal(schema);
            }
          });

          grid.appendChild(card);
        });
      }

      // ============================================
      // FILTRES
      // ============================================
      const filterBtns = document.querySelectorAll('.schemas-filters__btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderCards(btn.dataset.filter);
        });
      });

      // ============================================
      // MODAL
      // ============================================
      const modal = document.getElementById('schemaModal');
      const modalImg = document.getElementById('modalImg');
      const modalTitle = document.getElementById('modalTitle');
      const modalDifficulty = document.getElementById('modalDifficulty');
      const modalNiveaux = document.getElementById('modalNiveaux');
      const modalComponents = document.getElementById('modalComponents');
      const modalSteps = document.getElementById('modalSteps');
      const modalClose = document.getElementById('modalClose');

      const DIFFICULTY_CLASSES = {
        debutant: 'schema-card__difficulty--debutant',
        intermediaire: 'schema-card__difficulty--intermediaire',
        avance: 'schema-card__difficulty--avance'
      };

      const NIVEAU_CHIP_CLASSES = {
        '5eme': 'schema-modal__niveau-chip--5eme',
        '4eme': 'schema-modal__niveau-chip--4eme',
        '3eme': 'schema-modal__niveau-chip--3eme'
      };

      function openModal(schema) {
        // Image
        modalImg.src = schema.image;
        modalImg.alt = `Schéma : ${schema.title}`;

        // Titre + difficulté
        modalTitle.textContent = schema.title;
        modalDifficulty.textContent = DIFFICULTY_LABELS[schema.difficulty];
        modalDifficulty.className = 'schema-modal__difficulty-badge ' + (DIFFICULTY_CLASSES[schema.difficulty] || '');

        // Niveaux
        modalNiveaux.innerHTML = schema.niveaux.map(n =>
          `<span class="schema-modal__niveau-chip ${NIVEAU_CHIP_CLASSES[n] || ''}">${n.replace('eme', 'ème')}</span>`
        ).join('');

        // Composants
        modalComponents.innerHTML = schema.composants.map(c =>
          `<li>🔹 ${c}</li>`
        ).join('');

        // Consignes
        modalSteps.innerHTML = schema.consignes.map(s =>
          `<li>${s}</li>`
        ).join('');

        // Afficher avec animation
        modal.classList.add('show', 'entering');
        requestAnimationFrame(() => {
          modal.classList.remove('entering');
        });

        // Bloquer le scroll du body
        document.body.style.overflow = 'hidden';

        // Focus trap basique
        modalClose.focus();
      }

      function closeModal() {
        modal.classList.remove('show');
        document.body.style.overflow = '';
      }

      // Fermeture : bouton ✕
      modalClose.addEventListener('click', closeModal);

      // Fermeture : clic sur l'overlay (pas sur le modal lui-même)
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
      });

      // Fermeture : touche Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('show')) {
          closeModal();
        }
      });

      // ============================================
      // INIT
      // ============================================
      renderCards();
    </script>
  </body>
</html>
